<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudForge — Status</title>
</head>
<body>
  <div class="page">

    <!-- Header -->
    <header class="header">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4 4 0 003 15z"
            stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
        <span class="logo-text">CloudForge</span>
      </div>
      <span class="env-badge">Production</span>
    </header>

    <!-- Hero status indicator -->
    <main class="main">
      <div class="status-hero" role="status" aria-live="polite">
        <div class="glow-ring" aria-hidden="true">
          <div class="pulse-dot" aria-hidden="true"></div>
          <svg class="check-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h1 class="status-title">Application Healthy</h1>
        <p class="status-subtitle">CloudForge is running successfully</p>
      </div>

      <!-- Detail cards -->
      <div class="cards" role="list">

        <div class="card" role="listitem">
          <span class="card-label">Status</span>
          <span class="card-value operational">
            <span class="pulse-indicator" aria-hidden="true"></span>
            Operational
          </span>
        </div>

        <div class="card" role="listitem">
          <span class="card-label">Environment</span>
          <span class="card-value">Production</span>
        </div>

        <div class="card" role="listitem">
          <span class="card-label">Version</span>
          <span class="card-value">v1.0.0</span>
        </div>

        <div class="card" role="listitem">
          <span class="card-label">Uptime</span>
          <span class="card-value" id="uptime">—</span>
        </div>

        <div class="card" role="listitem">
          <span class="card-label">Last Checked</span>
          <span class="card-value" id="last-checked">—</span>
        </div>

      </div>

      <!-- Pipeline row -->
      <div class="pipeline" role="list" aria-label="Deployment pipeline stages">
        <div class="pipeline-step" role="listitem">
          <span class="step-label">Infrastructure</span>
          <span class="step-check" aria-label="passed">✓</span>
        </div>
        <div class="pipeline-arrow" aria-hidden="true">→</div>
        <div class="pipeline-step" role="listitem">
          <span class="step-label">Build</span>
          <span class="step-check" aria-label="passed">✓</span>
        </div>
        <div class="pipeline-arrow" aria-hidden="true">→</div>
        <div class="pipeline-step" role="listitem">
          <span class="step-label">Security</span>
          <span class="step-check" aria-label="passed">✓</span>
        </div>
        <div class="pipeline-arrow" aria-hidden="true">→</div>
        <div class="pipeline-step" role="listitem">
          <span class="step-label">Deployment</span>
          <span class="step-check" aria-label="passed">✓</span>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <span>Powered by AWS · Terraform · Ansible · CI/CD · DevSecOps</span>
    </footer>

  </div>

  <!-- Vite entry point — module import replaces the old <script src="app.js"> -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
